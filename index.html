<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomePage</title>
</head>
<body>
    <h1>What Can JavaScript Do?</h1>

    <p id="example">Lights On.</p>
    <p>JavaScript can change CSS styles.</p>
    <p>JavaScript can react to events.</p>

    <button type="button"
    onclick="document.getElementById('example').innerHTML = 'Lights are now off!!';"
    
    
    
    >Click Me!</button>

</body>
</html>
